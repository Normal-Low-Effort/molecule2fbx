[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule2fbx"
version = "0.4.1"
description = "Generate provenance-aware molecular FBX models from PubChem, SMILES, or XYZ"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "rdkit>=2023.3.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
molecule2fbx = "molecule2fbx.cli:main"

[tool.setuptools.packages.find]
include = ["molecule2fbx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
